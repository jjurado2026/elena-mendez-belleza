<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Elena Méndez Medicina Estética</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/gilda-display-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/urbanist.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Gilda Display'; src: url('assets/fonts/gilda-display-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Urbanist'; src: url('assets/fonts/urbanist.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root {
    --noche: #2F3854; --noche-honda: #20263A; --texto: #4A5068; --oro: #F4D058; --oro-marca: #E2B93B; --oro-tinta: #8A6A12;
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --muelle: linear(0, .049, .174, .34, .521, .696, .849, .974, 1.065, 1.124, 1.155, 1.163, 1.153, 1.132, 1.104, 1.075, 1.046, 1.022, 1.002, .988, .979, .974, .973, .975, .979, .984, .988, .993, .997, 1, 1.002, 1.004, 1.004, 1.004, 1.004, 1.003, 1);
    --alto: min(62svh, 560px);
  }
  @supports not (transition-timing-function: linear(0, 1)) { :root { --muelle: cubic-bezier(.34, 1.56, .64, 1); } }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: #fff; color: var(--texto);
    font-family: 'Urbanist', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: clamp(1rem, .95rem + .25vw, 1.1875rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 2px solid var(--oro-tinta); outline-offset: 3px; border-radius: 3px; }

  .cab { padding: clamp(14px, 2.6svh, 26px) var(--canal) 0; display: flex; justify-content: center; }
  .cab img { height: clamp(52px, 3vw + 36px, 76px); width: auto; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(28px, 6svh, 72px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Gilda Display', Georgia, serif; font-weight: 400; color: var(--noche); font-size: clamp(1.875rem, 1.1rem + 2.6vw, 3.375rem); line-height: 1.12; text-wrap: balance; max-width: 18ch; }
  .mas { font-size: clamp(1.0625rem, .95rem + .45vw, 1.375rem); max-width: 34em; }
  .mas a { color: var(--noche); font-weight: 650; text-decoration: underline; text-decoration-color: var(--oro-marca); text-decoration-thickness: 2px; text-underline-offset: 5px; overflow-wrap: anywhere; display: inline-block; transition: transform .45s var(--muelle); }
  .mas a:hover { transform: translateY(-2px); }
  .mas a:active { transform: translateY(1px); }

  /* los cuatro puntos del marcaje, como en la home */
  .marcas { display: flex; gap: 10px; }
  .marcas i { width: 9px; height: 9px; border-radius: 50%; background: var(--oro-marca); }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; border-radius: 6px; background: #fff;
    box-shadow: 0 0 0 1px rgba(47, 56, 84, .12), 0 30px 60px -28px rgba(32, 38, 58, .55); position: relative; }
  .ventana::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(244, 208, 88, .7); border-radius: 3px; pointer-events: none; }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes punto { from { opacity: 0; transform: scale(0); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(2) { animation-delay: .1s; } .aviso__texto > :nth-child(3) { animation-delay: .2s; }
    .marcas i { animation: punto .6s var(--muelle) both; }
    .marcas i:nth-child(2) { animation-delay: .1s; } .marcas i:nth-child(3) { animation-delay: .2s; } .marcas i:nth-child(4) { animation-delay: .3s; }
    .ventana { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 52s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <img src="assets/img/logo-elena-mendez.webp" width="422" height="216" alt="Elena Méndez Medicina Estética">
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <span class="marcas" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Elena%20M%C3%A9ndez%20Medicina%20Est%C3%A9tica">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home completa">
        <img src="assets/img/home-miniatura.webp" width="480" height="3815" alt="Miniatura de la home propuesta para Elena Méndez Medicina Estética, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
